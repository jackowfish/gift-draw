"on":
    push:
        branches:
            - main
name: Deploy to gift-draw
jobs:
    porter-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Set Github tag
              id: vars
              run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
            - name: Setup porter
              uses: porter-dev/setup-porter@v0.1.0
            - name: Deploy stack
              timeout-minutes: 30
              run: porter apply
              env:
                PORTER_APP_NAME: gift-draw
                PORTER_CLUSTER: "2"
                PORTER_DEPLOYMENT_TARGET_ID: 8d9c8a39-3ede-4846-af57-1b8b25d1a4b2
                PORTER_HOST: https://jack.withporter.run
                PORTER_PROJECT: "1"
                PORTER_TAG: ${{ steps.vars.outputs.sha_short }}
                PORTER_TOKEN: ${{ secrets.PORTER_APP_1_5 }}
