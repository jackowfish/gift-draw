<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gift Draw" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#0b2447" />
  <title>Gift Draw</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lato:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- Night-sky scene with stars, distant aurora, snowy hills + pines -->
  <div class="scene" aria-hidden="true">
    <div class="aurora"></div>
    <div class="stars"></div>
    <div class="snowfall snowfall-a"></div>
    <div class="snowfall snowfall-b"></div>
    <div class="snowfall snowfall-c"></div>

    <svg class="hills" viewBox="0 0 1440 420" preserveAspectRatio="none" aria-hidden="true">
      <!-- back hills -->
      <path d="M0 260 C 180 200, 360 320, 540 260 S 900 180, 1080 250 1440 220 1440 420 0 420 Z" fill="#1b3a6b"/>
      <!-- pines back row -->
      <g fill="#0e2547">
        <polygon points="90,260 110,210 130,260"/>
        <polygon points="230,250 260,180 290,250"/>
        <polygon points="430,245 460,170 490,245"/>
        <polygon points="640,255 670,190 700,255"/>
        <polygon points="860,250 890,178 920,250"/>
        <polygon points="1080,255 1110,185 1140,255"/>
        <polygon points="1280,250 1310,180 1340,250"/>
      </g>
      <!-- front hill -->
      <path d="M0 320 C 200 280, 400 360, 640 310 S 1100 280, 1440 320 L1440 420 0 420 Z" fill="#ffffff"/>
      <!-- pines front row -->
      <g fill="#0e6b3a">
        <polygon points="60,330 90,250 120,330"/>
        <polygon points="160,338 200,240 240,338"/>
        <polygon points="320,332 360,235 400,332"/>
        <polygon points="520,330 555,245 590,330"/>
        <polygon points="720,330 760,225 800,330"/>
        <polygon points="940,332 980,238 1020,332"/>
        <polygon points="1140,330 1180,238 1220,330"/>
        <polygon points="1340,335 1380,250 1420,335"/>
      </g>
      <!-- snowy caps on front pines -->
      <g fill="#ffffff">
        <polygon points="90,253 100,265 80,265"/>
        <polygon points="200,244 213,260 187,260"/>
        <polygon points="360,238 373,254 347,254"/>
        <polygon points="555,248 568,264 542,264"/>
        <polygon points="760,228 775,246 745,246"/>
        <polygon points="980,242 993,258 967,258"/>
        <polygon points="1180,242 1193,258 1167,258"/>
        <polygon points="1380,253 1393,269 1367,269"/>
      </g>
    </svg>
  </div>

  <!-- Santa + reindeer + sleigh — pulled out of .scene so he can fly OVER
       the panels rather than behind them. Snowdrops fall from the sleigh as
       it crosses the sky. -->
  <div class="sleigh-wrap" aria-hidden="true">
    <svg class="sleigh" viewBox="0 0 240 90">
      <!-- motion trail -->
      <g stroke="rgba(255,255,255,0.55)" stroke-width="1" stroke-linecap="round" fill="none">
        <path d="M0 50 q 30 -6 60 0" opacity="0.55"/>
        <path d="M0 60 q 30 -4 50 0" opacity="0.4"/>
        <path d="M0 42 q 30 -8 45 -4" opacity="0.3"/>
      </g>

      <!-- Rudolph (lead reindeer, with red nose) -->
      <g transform="translate(178 30)">
        <!-- antlers -->
        <path d="M2 -2 l -4 -8 m 0 0 l -4 2 m 4 -2 l -2 -6
                 M 8 -2 l 4 -8 m 0 0 l 4 2 m -4 -2 l 2 -6"
              stroke="#e9d3a8" stroke-width="1.2" stroke-linecap="round" fill="none"/>
        <!-- head/body -->
        <path d="M -4 0 q 4 -6 12 -4 q 6 1 6 5 l -2 4 q -2 2 -4 2 l -2 2
                 l -8 2 q -8 0 -12 -2 q -4 -2 -2 -6 q 2 -4 8 -4 z"
              fill="#7a4a25"/>
        <!-- legs -->
        <g stroke="#5b3719" stroke-width="2" stroke-linecap="round">
          <line x1="-2" y1="8" x2="-3" y2="16"/>
          <line x1="4"  y1="9" x2="3"  y2="17"/>
          <line x1="10" y1="9" x2="11" y2="17"/>
          <line x1="16" y1="8" x2="17" y2="16"/>
        </g>
        <!-- red nose -->
        <circle cx="-3" cy="4" r="2.2" fill="#ff3344"/>
        <circle cx="-3.6" cy="3.4" r="0.7" fill="#ffd1d1"/>
        <!-- eye -->
        <circle cx="2" cy="-1" r="0.8" fill="#1a1a1a"/>
      </g>

      <!-- Second reindeer (a little behind, slightly smaller) -->
      <g transform="translate(140 36) scale(0.9)">
        <path d="M2 -2 l -3 -7 m 0 0 l -3 2 m 3 -2 l -2 -5
                 M 7 -2 l 3 -7 m 0 0 l 3 2 m -3 -2 l 2 -5"
              stroke="#e9d3a8" stroke-width="1.1" stroke-linecap="round" fill="none"/>
        <path d="M -3 0 q 4 -5 10 -3 q 5 1 5 4 l -2 3 q -2 2 -4 2 l -2 2
                 l -7 2 q -7 0 -10 -2 q -3 -2 -1 -5 q 2 -4 7 -3 z"
              fill="#6b4220"/>
        <g stroke="#4d2f15" stroke-width="2" stroke-linecap="round">
          <line x1="-1" y1="8" x2="-2" y2="15"/>
          <line x1="3"  y1="9" x2="2"  y2="16"/>
          <line x1="8"  y1="9" x2="9"  y2="16"/>
          <line x1="13" y1="8" x2="14" y2="15"/>
        </g>
        <circle cx="1" cy="-1" r="0.7" fill="#1a1a1a"/>
      </g>

      <!-- reins -->
      <g stroke="#caa56b" stroke-width="0.8" fill="none" stroke-linecap="round">
        <path d="M118 42 q 20 -4 56 -8"/>
        <path d="M118 46 q 20 0 36 -2"/>
      </g>

      <!-- Sleigh body -->
      <g transform="translate(70 38)">
        <!-- runner (skid) -->
        <path d="M -4 26 q 4 4 56 0 q 4 -2 6 -4 l -2 -2 q -4 2 -52 4 q -6 0 -10 -2 z"
              fill="#4a1318"/>
        <!-- main sleigh body -->
        <path d="M 0 4 q 4 -6 14 -6 l 26 0 q 6 0 8 4
                 l 4 12 q 2 4 -2 8 l -4 4 q -3 2 -6 2 l -36 0
                 q -6 0 -8 -4 q -2 -4 -2 -10 z"
              fill="#c2272d"/>
        <!-- back curl of the sleigh -->
        <path d="M 0 8 q -10 -6 -8 -16 q 4 -4 6 0 q 2 6 2 16 z" fill="#c2272d"/>
        <!-- gold trim -->
        <path d="M -2 18 l 60 -2" stroke="#ffd54f" stroke-width="1.5" fill="none"/>
        <!-- side window highlight -->
        <ellipse cx="22" cy="12" rx="10" ry="3" fill="#7a161a"/>

        <!-- presents stacked in back -->
        <rect x="-2" y="-4" width="12" height="10" fill="#f5b831"/>
        <rect x="-2" y="0"  width="12" height="2" fill="#c9931a"/>
        <rect x="3"  y="-4" width="2"  height="10" fill="#c9931a"/>
        <rect x="6"  y="-9" width="9"  height="6" fill="#1faa59"/>
        <rect x="6"  y="-7" width="9"  height="1.5" fill="#0f6a39"/>

        <!-- Santa: red coat, white trim, hat with bobble -->
        <g transform="translate(34 -6)">
          <!-- coat body -->
          <path d="M -4 6 q 0 -6 6 -6 l 6 0 q 6 0 6 6 l 0 8 l -18 0 z" fill="#e63946"/>
          <!-- white belt -->
          <rect x="-4" y="12" width="18" height="2" fill="#fff"/>
          <rect x="3" y="12" width="2" height="2" fill="#ffd54f"/>
          <!-- white fur trim along bottom of coat -->
          <rect x="-4" y="14" width="18" height="1.5" fill="#fff"/>
          <!-- arm raised waving -->
          <path d="M 12 4 q 6 -2 8 -8 q -1 -2 -3 -1 q -2 4 -7 6 z" fill="#e63946"/>
          <circle cx="20" cy="-4" r="1.6" fill="#f3c89b"/>
          <!-- head -->
          <circle cx="5" cy="-2" r="3.6" fill="#f3c89b"/>
          <!-- beard -->
          <path d="M 1.5 -1 q 3.5 6 7 0 q 0 4 -3.5 5 q -3.5 -1 -3.5 -5 z" fill="#fff"/>
          <!-- hat -->
          <path d="M 1 -4 q 4 -7 9 -3 q 2 1 1 3 z" fill="#e63946"/>
          <!-- hat fur trim -->
          <rect x="1" y="-4" width="9" height="1.6" fill="#fff"/>
          <!-- hat bobble -->
          <circle cx="11" cy="-7" r="1.4" fill="#fff"/>
        </g>
      </g>

      <!-- Snow drops falling from the sleigh. Each circle has its own CSS
           animation-delay so they emerge in a staggered stream. -->
      <g class="snowdrops">
        <circle class="snowdrop" cx="62"  cy="62" r="4.5"/>
        <circle class="snowdrop" cx="76"  cy="60" r="3.6"/>
        <circle class="snowdrop" cx="88"  cy="64" r="5.0"/>
        <circle class="snowdrop" cx="100" cy="60" r="3.8"/>
        <circle class="snowdrop" cx="112" cy="62" r="4.8"/>
        <circle class="snowdrop" cx="124" cy="58" r="3.2"/>
        <circle class="snowdrop" cx="136" cy="60" r="4.2"/>
      </g>
    </svg>
  </div>

  <!-- Top nav ribbon -->
  <header class="top-nav" role="banner">
    <a href="/" class="brand" aria-label="Gift Draw home">
      <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
        <rect x="8" y="22" width="48" height="34" rx="4" fill="#e63946"/>
        <rect x="8" y="32" width="48" height="6" fill="#b32230"/>
        <rect x="29" y="22" width="6" height="34" fill="#ffd54f"/>
        <path d="M32 22 c-6 -10 -18 -10 -18 -2 c0 6 10 6 18 2 z" fill="#ffd54f"/>
        <path d="M32 22 c 6 -10 18 -10 18 -2 c 0 6 -10 6 -18 2 z" fill="#ffd54f"/>
        <circle cx="32" cy="22" r="3" fill="#c9931a"/>
      </svg>
      <span class="brand-text">
        <span class="brand-gift">Gift</span><span class="brand-draw">Draw</span>
      </span>
    </a>
  </header>

  <main id="app">
    <section id="lobby" class="panel">
      <div class="panel-head">
        <div class="bauble bauble-red"></div>
        <div class="bauble bauble-green"></div>
        <div class="bauble bauble-gold"></div>
      </div>

      <div class="panel-body">
        <h1 class="hero-title">
          <span>Draw names.</span>
          <span class="hero-accent">Send joy.</span>
        </h1>
        <p class="hero-sub" id="lobbyTagline">Start a draw, share the link, everyone finds out who they got.</p>

        <p class="join-banner hidden" id="joinBanner">
          You're joining <code id="joinBannerCode"></code>
        </p>

        <div class="fields">
          <label class="field">
            <span>Your name</span>
            <input id="name" placeholder="Alex" maxlength="40" autocomplete="name" />
          </label>

          <label class="field" id="emailField">
            <span>Your email</span>
            <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="alex@example.com" maxlength="120" />
          </label>
        </div>

        <div id="createBlock">
          <label class="field">
            <span>Occasion <em>(optional)</em></span>
            <input id="occasion" placeholder="Secret santa, birthday…" maxlength="60" />
          </label>

          <label class="toggle toggle-inline">
            <input type="checkbox" id="collectEmails" checked />
            <span>Email everyone their pick</span>
            <em class="toggle-hint">Off = picks only shown in the app</em>
          </label>

          <button id="create" class="btn btn-primary btn-big">
            <span class="btn-icon" aria-hidden="true">🎁</span>
            Start a new draw
          </button>

          <div class="divider"><span>or join one</span></div>

          <div class="join-row">
            <input id="joinCode" placeholder="DRAW CODE" maxlength="6" class="code-input" />
            <button id="join" class="btn btn-secondary">Join</button>
          </div>
        </div>

        <div id="joinBlock" class="hidden">
          <button id="joinHash" class="btn btn-primary btn-big">
            <span class="btn-icon" aria-hidden="true">✨</span>
            Hop in
          </button>
          <button id="backToMain" class="link back-link">← back</button>
        </div>

        <p id="lobbyErr" class="err" aria-live="polite"></p>
      </div>
    </section>

    <section id="room" class="panel hidden">
      <div class="panel-head">
        <div class="bauble bauble-red"></div>
        <div class="bauble bauble-green"></div>
        <div class="bauble bauble-gold"></div>
      </div>

      <div class="panel-body">
        <header class="room-header">
          <div class="room-code-box">
            <span class="label">Draw code</span>
            <code id="roomId">----</code>
          </div>
          <div class="room-actions">
            <span id="youAre" class="role-pill"></span>
            <button id="copyLink" class="link">Copy invite</button>
          </div>
        </header>

        <p id="occasionLine" class="occasion-line hidden"></p>

        <div class="status-bar">
          <span id="stateLabel" class="status-chip">Collecting</span>
          <span id="counts" class="counts"></span>
        </div>

        <section id="myInfo" class="my-info">
          <div class="my-info-head">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="my-icon"><path d="M12 2l2.39 4.84 5.34.78-3.86 3.76.91 5.32L12 14.77l-4.78 2.51.91-5.32L4.27 8.2l5.34-.78z" fill="#ffd54f"/></svg>
            <h3>You</h3>
          </div>
          <label class="field">
            <span>Name</span>
            <input id="myName" maxlength="40" autocomplete="name" />
          </label>
          <label class="field" id="myEmailField">
            <span>Email</span>
            <input id="myEmail" type="email" inputmode="email" autocomplete="email" maxlength="120" placeholder="you@example.com" />
          </label>
          <label class="toggle hidden" id="skipDrawRow">
            <input type="checkbox" id="skipDraw" />
            <span>Don't put me in the draw (I'm just running it)</span>
          </label>
          <p id="myStatus" class="my-status"></p>
        </section>

        <div class="members-head">
          <h3>Everyone in the draw</h3>
        </div>
        <ul id="members" class="members"></ul>

        <div id="result" class="result hidden">
          <div class="present" aria-hidden="true">
            <div class="present-box"></div>
            <div class="present-ribbon-v"></div>
            <div class="present-ribbon-h"></div>
            <div class="present-bow"></div>
          </div>
          <div class="result-label">You're giving to</div>
          <div class="big" id="pickName">—</div>
          <p class="result-sub" id="pickDetail">Check your inbox for the same info.</p>
        </div>

        <div id="hostRow" class="host-row hidden">
          <button id="drawBtn" class="btn btn-accent btn-big">
            <span class="btn-icon" aria-hidden="true">🎲</span>
            Draw names
          </button>
          <button id="resetBtn" class="btn btn-secondary hidden">Redraw</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span class="credit">
      Made with <span class="heart" aria-hidden="true">♥</span> by <a href="https://github.com/jackowfish" class="signature" rel="noopener noreferrer">Jack Decker</a>
    </span>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
